<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>buzzdetect web</title>
    <meta
      name="description"
      content="Run the buzzdetect pollinator-buzz model on audio in your browser. Nothing is uploaded."
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Icon sprite: referenced by <use>, so each glyph is defined once. -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <g id="i-start">
          <path d="M6 5v14M19 5l-11 7 11 7z" />
        </g>
        <g id="i-play"><path d="M7 4l13 8-13 8z" /></g>
        <g id="i-pause"><path d="M8 4v16M16 4v16" /></g>
        <g id="i-mic">
          <path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z" />
          <path d="M5 11a7 7 0 0 0 14 0M12 18v3" />
        </g>
        <g id="i-stop"><path d="M6 6h12v12H6z" /></g>
        <g id="i-volume">
          <path d="M4 9v6h4l5 4V5L8 9z" />
          <path d="M17 8a5 5 0 0 1 0 8" />
        </g>
      </defs>
    </svg>

    <header class="bar">
      <div class="brand"><strong>buzzdetect</strong><span class="muted">web demo</span></div>

      <div class="group">
        <label class="button" for="file">Open audio…</label>
        <input id="file" type="file" accept="audio/*,.wav,.mp3,.m4a,.flac,.ogg" hidden />
        <button id="mic" class="button icon-button" type="button" title="Live microphone">
          <svg class="icon" viewBox="0 0 24 24"><use href="#i-mic" /></svg>
          <span id="mic-label">Live microphone</span>
        </button>
      </div>

      <span id="live-badge" class="badge" hidden>
        <span class="dot"></span>LIVE
        <span class="meter"><span id="meter-fill"></span></span>
      </span>

      <span class="grow"></span>
      <span id="status" class="status">Loading model…</span>
    </header>

    <main>
      <!-- Spectrogram: frequency gutter, then the plot. -->
      <section class="panel plot">
        <div class="panel-head">
          <span id="filename" class="muted">No file loaded</span>
          <span class="grow"></span>
          <label class="inline small">
            Hz
            <input id="min-hz" class="num" type="number" min="0" step="100" value="0" />
            <span class="muted">–</span>
            <input id="max-hz" class="num" type="number" min="100" step="100" value="6000" />
          </label>
          <label class="inline small">
            Contrast
            <input id="level-min" type="range" min="0" max="255" step="1" value="53" />
            <input id="level-max" type="range" min="0" max="255" step="1" value="200" />
          </label>
          <span id="readout" class="mono small muted"></span>
        </div>
        <div class="plotrow">
          <canvas id="spec-axis" class="gutter"></canvas>
          <div id="spec" class="spec"></div>
        </div>
      </section>

      <!-- Shared time axis, indented past the gutter so both panels align. -->
      <div class="timeaxis-row">
        <span class="gutter-spacer mono small muted">s</span>
        <div id="timeaxis" class="timeaxis"></div>
      </div>

      <!-- buzzdetect results, on the same time axis. -->
      <section class="panel">
        <div class="panel-head">
          <strong id="series" class="series">ins_buzz</strong>
          <label class="inline">
            Threshold
            <input id="threshold" class="num" type="number" step="0.05" value="-1.20" />
          </label>
          <span class="grow"></span>
          <span id="detection-count" class="mono small muted"></span>
        </div>
        <div class="plotrow acts-row">
          <canvas id="acts-axis" class="gutter"></canvas>
          <div id="acts" class="acts"></div>
        </div>
      </section>

      <section class="transport">
        <button id="to-start" class="button icon-button" type="button" title="Jump to start" disabled>
          <svg class="icon" viewBox="0 0 24 24"><use href="#i-start" /></svg>
        </button>
        <button id="play" class="button icon-button" type="button" title="Play / pause" disabled>
          <svg class="icon" viewBox="0 0 24 24"><use id="play-icon" href="#i-play" /></svg>
        </button>
        <span id="time" class="mono">0:00.0</span>

        <span class="grow"></span>

        <label class="inline" title="Playback gain — centre is unity, up to 3×">
          <svg class="icon muted" viewBox="0 0 24 24"><use href="#i-volume" /></svg>
          <input id="volume" type="range" min="0" max="1" step="0.005" value="0.5" />
          <output id="volume-out" class="mono small">1.0×</output>
        </label>
      </section>

      <p class="hint muted small">
        Drag to select · click a frame to select it · wheel to zoom · two-finger swipe to pan ·
        space to play/pause · filled dots are frames above threshold · nothing leaves your machine
      </p>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
